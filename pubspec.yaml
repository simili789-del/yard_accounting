name: yard_accounting
description: 货场作业记账 - Flutter 原生 APK 应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 状态管理
  flutter_riverpod: ^2.5.0
  freezed_annotation: ^2.4.0

  # 本地数据库
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 图表组件
  fl_chart: ^0.68.0

  # 文件处理
  csv: ^6.0.0
  path_provider: ^2.1.0
  share_plus: ^9.0.0

  # Excel 解析（导入微信分享的表格）
  excel: ^4.0.6
  # 接收微信/系统分享的文件
  receive_sharing_intent: ^1.9.0
  # App 内手动选择本地文件导入
  file_picker: ^8.0.0

  # 工具库
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.0
  hive_generator: ^2.0.1
  freezed: ^2.5.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  # assets/images/ 当前无资源，暂不声明，避免 analyze 报 asset_directory_does_not_exist
  # 如后续放入图片资源，恢复下面这行即可：
  # assets:
  #   - assets/images/
  fonts: []
