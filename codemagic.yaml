workflows:
  android-workflow:
    name: Android Build & Sign
    max_build_duration: 60
    environment:
      # 3.47.0 对应 Dart 3.7+；excel2003 依赖要求 Dart >=3.7.2。
      # 旧版 3.24.5 (Dart 3.5.4) 会因 SDK 约束导致 pub get 失败。
      flutter: 3.47.0
      java: 17
      vars:
        PACKAGE_NAME: "com.yard.accounting"
    # 持久缓存：第一次下载成功的 Gradle 压缩包会被缓存，后续构建直接复用，不再联网。
    cache:
      cache_paths:
        - $HOME/.gradle_offline
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate code (Hive/Freezed)
        script: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Analyze code
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build APK (arm64 single)
        script: |
          set -e
          GRADLE_VER=8.1.1
          ZIP="gradle-${GRADLE_VER}-bin.zip"
          # 放到 $HOME 持久目录（配合 cache 跨构建保留）
          DEST="$HOME/.gradle_offline"
          mkdir -p "$DEST"
          LOCAL_ZIP="$DEST/$ZIP"

          # 断点续传下载：弱网被截断可续上而非从头重下；下载后做 zip 结构校验。
          download_gradle() {
            local url="$1"
            echo "尝试源: $url"
            for i in 1 2 3 4 5 6; do
              if curl -fL --connect-timeout 30 --max-time 900 --retry 5 --retry-delay 5 -C - \
                   -o "$LOCAL_ZIP" "$url"; then
                if python3 -c "import zipfile,sys; sys.exit(0 if zipfile.ZipFile('$LOCAL_ZIP').testzip() is None else 1)"; then
                  echo "  ✓ 第${i}次: 下载完整且 zip 结构校验通过"; return 0
                else
                  echo "  ✗ 第${i}次: 文件损坏,删除后重试"; rm -f "$LOCAL_ZIP"
                fi
              else
                echo "  ✗ 第${i}次: 下载失败($?),重试"
              fi
              sleep 3
            done
            return 1
          }

          # 若已缓存且校验通过则直接复用；否则先删损坏缓存再下载。
          if [ -f "$LOCAL_ZIP" ] && python3 -c "import zipfile; zipfile.ZipFile('$LOCAL_ZIP').testzip()" 2>/dev/null; then
            echo "== 复用已缓存且有效的 Gradle 压缩包 =="
          else
            [ -f "$LOCAL_ZIP" ] && rm -f "$LOCAL_ZIP"
            echo "== 下载 Gradle ${GRADLE_VER} (官方源 + 断点续传 + 校验 + 重试) =="
            download_gradle "https://services.gradle.org/distributions/${ZIP}" || {
              echo "ERROR: 官方源未能取得有效的 Gradle 压缩包"; exit 1
            }
          fi
          echo "Gradle 压缩包就绪: $LOCAL_ZIP ($(du -h "$LOCAL_ZIP" | cut -f1))"

          # 将 distributionUrl 指向本地已校验包，彻底绕过构建时的网络下载。
          # 注意：不再删除 ~/.gradle/wrapper/dists 缓存，避免误删构建机已有缓存。
          sed -i "s|^distributionUrl=.*|distributionUrl=file://${LOCAL_ZIP}|" \
            android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

          echo "== 构建 APK =="
          flutter build apk --release --target-platform android-arm64
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - team@yard-accounting.com
