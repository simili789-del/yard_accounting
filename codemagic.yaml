workflows:
  android-workflow:
    name: Android Build & Sign
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      java: 17
      vars:
        PACKAGE_NAME: "com.yard.accounting"
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate code (Hive/Freezed)
        script: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Analyze code
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build APK (split per ABI)
        script: flutter build apk --release --split-per-abi
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - team@yard-accounting.com
