workflows:
  android-workflow:
    name: Android Build & Sign
    max_build_duration: 60
    environment:
      # 3.47.0 对应 Dart 3.7+；excel2003 依赖要求 Dart >=3.7.2。
      # 旧版 3.24.5 (Dart 3.5.4) 会因 SDK 约束导致 pub get 失败。
      flutter: 3.47.0
      java: 17
      vars:
        PACKAGE_NAME: "com.yard.accounting"
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Pre-install Gradle 8.0 (bypass flaky wrapper download)
        script: |
          set -e
          GRADLE_VER=8.0
          GRADLE_ZIP="gradle-${GRADLE_VER}-all.zip"
          GRADLE_URL="https://services.gradle.org/distributions/${GRADLE_ZIP}"
          TMP_ZIP="/tmp/${GRADLE_ZIP}"
          if [ -f "${TMP_ZIP}" ]; then
            echo "Gradle zip already cached at ${TMP_ZIP}"
          else
            echo "Downloading ${GRADLE_ZIP} with retry..."
            for i in 1 2 3 4 5; do
              if curl -L --connect-timeout 30 --max-time 300 -o "${TMP_ZIP}" "${GRADLE_URL}"; then
                echo "Download succeeded on attempt ${i}."
                break
              fi
              echo "Attempt ${i} failed, retrying..."
              rm -f "${TMP_ZIP}"
              sleep 5
            done
            if [ ! -f "${TMP_ZIP}" ]; then
              echo "ERROR: Failed to download Gradle after 5 attempts."
              exit 1
            fi
          fi
          echo "Gradle zip ready at ${TMP_ZIP}"
          # 把 wrapper 的 distributionUrl 改为本地 file: 路径，彻底绕过网络下载
          GRADLE_FILE_URL="file\\:${TMP_ZIP}"
          sed -i.bak "s|^distributionUrl=.*|distributionUrl=${GRADLE_FILE_URL}|" \
            android/gradle/wrapper/gradle-wrapper.properties
          echo "Updated gradle-wrapper.properties:"
          cat android/gradle/wrapper/gradle-wrapper.properties
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate code (Hive/Freezed)
        script: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Analyze code
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build APK (arm64 single)
        script: flutter build apk --release --target-platform android-arm64
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - team@yard-accounting.com
